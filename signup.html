<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoShield AI - Create Account & Biometric Enrollment</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="signup.css">
</head>

<body>

    <!-- Ambient Glowing Background Elements -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="cyber-grid"></div>

    <div class="signup-container">

        <div class="signup-card">

            <!-- Security Badge -->
            <div class="security-pill">
                <span class="pulse-dot"></span>
                <span>BIOMETRIC DEFENSE ENROLLMENT</span>
            </div>

            <!-- Logo -->
            <div class="logo-wrapper">
                <div class="logo-aura"></div>
                <div class="logo">
                    🛡️
                </div>
            </div>

            <h1>Create Account</h1>

            <p class="subtitle">
                Join the GeoShield AI Emergency Response Network
            </p>

            <!-- SIGNUP FORM -->
            <form autocomplete="off">

                <!-- FULL NAME -->
                <div class="input-group">
                    <label for="name">
                        <span class="label-icon">👤</span> Full Name
                    </label>
                    <div class="input-wrapper">
                        <input type="text" id="name" placeholder="John Doe" required>
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="input-group">
                    <label for="email">
                        <span class="label-icon">✉️</span> Email Address
                    </label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="agent@geoshield.ai" required>
                    </div>
                </div>

                <!-- PASSWORD GRID -->
                <div class="password-row">
                    <div class="input-group">
                        <label for="password">
                            <span class="label-icon">🔒</span> Password
                        </label>
                        <div class="input-wrapper password-box">
                            <input type="password" id="password" placeholder="Create password" required>
                            <button type="button" id="togglePassword" class="eye-btn"
                                aria-label="Toggle password visibility">👁️</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirm-password">
                            <span class="label-icon">🛡️</span> Confirm
                        </label>
                        <div class="input-wrapper password-box">
                            <input type="password" id="confirm-password" placeholder="Repeat password" required>
                            <button type="button" id="toggleConfirmPassword" class="eye-btn"
                                aria-label="Toggle confirm password visibility">👁️</button>
                        </div>
                    </div>
                </div>

                <div id="passwordFeedback" class="password-feedback"></div>

                <!-- BIOMETRIC ENROLLMENT BOX -->
                <div class="face-registration">

                    <div class="face-reg-header">
                        <div class="reg-badge">REQUIRED</div>
                        <h2>Biometric Face Enrollment</h2>
                        <p>Scan your face to enable instant biometric zero-click login.</p>
                    </div>

                    <!-- CAMERA HUD FRAME -->
                    <div class="register-video-box" id="regVideoBox">
                        <div class="register-video-frame" id="regVideoFrame">
                            <video id="registerVideo" autoplay muted playsinline></video>

                            <!-- HUD Scan Overlay -->
                            <div class="face-scan-overlay" id="regScanOverlay">
                                <div class="hud-corner top-left"></div>
                                <div class="hud-corner top-right"></div>
                                <div class="hud-corner bottom-left"></div>
                                <div class="hud-corner bottom-right"></div>
                                <div class="scanner-bar"></div>
                                <div class="scanner-crosshair"></div>
                                <div class="hud-tag">ENROLLMENT SENSOR</div>
                            </div>
                        </div>
                    </div>

                    <!-- FACE STATUS -->
                    <p id="registerStatus" class="face-status">
                        Face not enrolled.
                    </p>

                    <!-- START FACE REGISTER BUTTON -->
                    <button type="button" id="startFaceRegister" class="face-reg-btn">
                        <span>📷 Scan & Enroll Face</span>
                    </button>

                </div>

                <!-- TERMS & CONDITIONS -->
                <label class="terms">
                    <input type="checkbox" required>
                    <span class="custom-check"></span>
                    <span class="terms-text">I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Biometric
                            Privacy Policy</a></span>
                </label>

                <!-- SUBMIT BUTTON -->
                <button type="submit" class="signup-btn">
                    <span>Initialize Account</span>
                    <span class="btn-arrow">→</span>
                </button>

            </form>

            <div class="card-footer">
                <p class="login-text">
                    Already registered?
                    <a href="login.html">Sign In Here</a>
                </p>

                <a href="index.html" class="back-home">
                    <span>← Return to Home Portal</span>
                </a>
            </div>

        </div>

    </div>

    <!-- SCRIPTS (Offline First with CDN Fallback) -->
    <script src="vendor/face-api/face-api.min.js"></script>
    <script>
        if (typeof faceapi === 'undefined') {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/face-api.js/dist/face-api.min.js';
            document.head.appendChild(s);
        }
    </script>
    <script src="js/script.js"></script>
</body>

</html>
